# ─── BACKEND (Spring Boot) ────────────────────────────────────────────────
# È il servizio «app» del docker-compose.yml.
# ${IMMAGINE_API} viene sostituito da scripts/deploy.sh con l'immagine pubblicata su GHCR.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: impianti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      imagePullSecrets:
        - name: ghcr                    # le credenziali per scaricare l'immagine privata da GHCR

      # Prima del backend parte questo container, che aspetta il database.
      # È il «depends_on» del docker-compose.yml.
      initContainers:
        - name: aspetta-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo 'aspetto il database...'; sleep 2; done"]

      containers:
        - name: app
          image: ${IMMAGINE_API}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://db:5432/impianti     # «db» è il nome del Service del database
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credenziali, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credenziali, key: POSTGRES_PASSWORD }
          # Il pod riceve richieste solo quando questa pagina risponde «UP».
          # È l'«healthcheck» del docker-compose.yml.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
---
# Service: dà al backend il nome «app». Il frontend (nginx) manda le chiamate /api/... ad app:8080.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: impianti
spec:
  selector:
    app: app
  ports:
    - port: 8080
