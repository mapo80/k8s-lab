# ─── FRONTEND (React + nginx) ─────────────────────────────────────────────
# È il servizio «web» del docker-compose.yml.
# ${IMMAGINE_WEB} viene sostituito da scripts/deploy.sh con l'immagine pubblicata su GHCR.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: impianti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: web
          image: ${IMMAGINE_WEB}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
# Service di tipo NodePort: apre il frontend sulla porta 30080.
# È il «ports: 3000:80» del docker-compose.yml. Il Codespace la mostra nella scheda PORTS.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: impianti
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      nodePort: 30080
