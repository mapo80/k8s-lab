# Il frontend e il backend sullo stesso origin: il browser chiama /api/...,
# nginx inoltra al servizio "app" togliendo il prefisso. Niente CORS, come
# con il proxy di Vite in sviluppo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # la barra finale di proxy_pass toglie /api: /api/enti?page=1 -> http://app:8080/enti?page=1
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # l'importazione può durare qualche secondo
        proxy_read_timeout 60s;
    }

    # i file di Vite hanno l'hash nel nome: si possono tenere in cache a lungo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # le rotte di React Router (/enti/42, /province/5...) non sono file:
    # si serve index.html e decide il router nel browser
    location / {
        try_files $uri $uri/ /index.html;
    }
}
