name: CI/CD

# Come con Render: GitHub fa i test, costruisce le 2 immagini e le mette su GHCR.
# Poi il job «deploy», che gira nel vostro Codespace, le installa nel cluster.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # test di unità e di integrazione (con PostgreSQL in Testcontainers)
      - name: Build e test
        run: ./mvnw --batch-mode verify

  web:
    # il frontend: lint, test e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test di unità
        run: npm test

      - name: Build
        run: npm run build

  publish:
    # le immagini si pubblicano solo se i test sono verdi, e solo dal branch main
    needs: [test, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome delle immagini
        id: meta
        # ghcr.io/<utente>/<repository>, tutto minuscolo (GHCR lo vuole così)
        run: echo "base=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immagine del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # collega l'immagine al repository
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.base }}/api:${{ github.sha }}
            ${{ steps.meta.outputs.base }}/api:latest

      - name: Immagine del frontend
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.base }}/web:${{ github.sha }}
            ${{ steps.meta.outputs.base }}/web:latest

  deploy:
    # gira nel vostro Codespace (il runner «codespace»), dove c'è il cluster.
    # Se il Codespace è spento, il job aspetta che lo riapriate.
    needs: publish
    # - solo nella vostra copia: il repository del corso non ha un cluster
    # - non sul primo commit (la copia dal template): il primo deploy lo lanciate voi nel Laboratorio 2
    if: github.repository != 'its-java-backend-2026/k8s-lab' && github.event.head_commit.message != 'Initial commit'
    runs-on: [self-hosted, k8s-lab]
    # un deploy alla volta
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy su Kubernetes
        env:
          # ogni commit ha la sua immagine (tag = codice del commit): così parte il rolling update
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy.sh

      - name: Indirizzo dell'applicazione
        run: |
          url="https://${CODESPACE_NAME}-30080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
          echo "Applicazione: $url"
          echo "### Applicazione online: $url" >> "$GITHUB_STEP_SUMMARY"
