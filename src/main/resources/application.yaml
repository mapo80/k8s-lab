spring:
  application:
    name: impianti-sportivi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/impianti}
    username: ${DB_USER:impianti}
    password: ${DB_PASSWORD:impianti}
  jpa:
    hibernate:
      # lo schema lo creano le migrazioni Flyway: Hibernate verifica soltanto
      ddl-auto: validate
    # niente query durante la serializzazione della risposta, fuori dalle transazioni
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  web:
    # messaggi di validazione in italiano, qualunque lingua chieda il client
    locale: it
    locale-resolver: fixed
  data:
    web:
      pageable:
        # pagina da 20 se il client non chiede altro, mai più di 100 righe
        default-page-size: 20
        max-page-size: 100

impianti:
  open-data:
    # l'URL della sorgente sta in configurazione, mai nel codice
    url: ${OPEN_DATA_URL:https://dati.puglia.it/ckan/dataset/1dcab801-3fd9-4f45-8e87-eeeaa070bd5f/resource/2b41da8f-a35f-487e-aae0-c370a8cfd4c4/download/enti.json}
    connect-timeout: 3s
    read-timeout: 15s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
